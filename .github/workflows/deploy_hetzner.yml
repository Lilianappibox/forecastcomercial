name: Deploy Hetzner

on:
  push:
    branches: [ "main", "develop*", "release*", "beta*" ]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.BUNDLE_RUBYGEMS__PKG__GITHUB__COM }}
  APP_VERSION: ${{ github.run_number  }}
  XDG_CONFIG_HOME: "/runner/_work/.config"
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: add master.key
        run: echo ${{ secrets.MASTER_KEY }} > config/master.key
      - name: GitHub Action for DigitalOcean - doctl
        uses: digitalocean/action-doctl@v2.5.0
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 600
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          build-args: |
            BUNDLE_RUBYGEMS__PKG__GITHUB__COM=${{ secrets.BUNDLE_RUBYGEMS__PKG__GITHUB__COM }}
            NODE_ENV=production
            RAILS_ENV=production
          context: .
          push: true
          tags: registry.digitalocean.com/${{ secrets.DO_REGISTRY }}/picap-forecast:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_k8s:
    if: ${{ github.ref_name == 'main' }}
    needs: [ build ]
    name: Deploy Hetzner by argo - Forecast Comercial
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/composite-actions/argo
        name: Deploy to Forecast Comercial Rails
        with:
          github_auth: ${{ secrets.GH_AUTH }}
          file_dir: picap-infra/k8s/apps/helm/
          path_helm: picap-forecast/values.yaml
          image_name: registry.digitalocean.com/${{ secrets.DO_REGISTRY }}/picap-forecast:${{ github.sha }}
          sso_shared_secret: ${{ secrets.SSO_SHARED_SECRET }}
